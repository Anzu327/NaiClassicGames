name: Build desktop games

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: NaiClassicGames-mac-arm64
          - runner: windows-2022
            artifact: NaiClassicGames-win-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run desktop:package
      - run: npm run desktop:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}.zip
          if-no-files-found: error
